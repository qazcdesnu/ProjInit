# docs/VerificationTools.md 12절의 CI. 이 저장소는 uv run projinit으로 검사기를 실행한다.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: git hook 경로 설정 (강제 장치 검사기용)
        run: git config core.hooksPath .githooks
      - name: 일괄 검사 (문서, 포인터, 작업 관리, 강제 장치, 커밋 이력, 테스트)
        run: uv run projinit check
      - name: PR 제목과 브랜치 이름
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: uv run projinit commits --subject "$PR_TITLE" --branch "$BRANCH"
      - name: 앞선 열린 PR 포함 여부
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName,headRefOid > "$RUNNER_TEMP/open-prs.json"
          uv run projinit pr-order --pr "$PR_NUMBER" --open-prs "$RUNNER_TEMP/open-prs.json"
