# ProjInit 검사기 설정. 형식은 docs/design/Package.md 4절에 있다.

[projinit]
# 이 저장소는 projinit 패키지 자체라서 설치된 버전이 아니라 작업 트리의 코드로 검사한다.
command = "uv run projinit"

[paths]
docs = "docs"
entry = "CLAUDE.md"
code_roots = ["src", "tests"]

[check]
commands = ["uv run python -m unittest discover -s tests -t ."]
# 커밋 규칙(docs/CommitRule.md 4절)의 기준 커밋. 이 저장소의 첫 커밋이다.
commit_baseline = "18e5cf3"

[template]
# 공통 문서(PR 규칙)의 빈 자리 repository에 들어갈 원격 저장소 주소.
repository = "git@github-qazcdesnu:qazcdesnu/ProjInit.git"
